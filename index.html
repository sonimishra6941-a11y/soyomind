<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOYO Mind - Your AI Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:15px;text-align:center;background:#1a1a1a;font-size:22px;font-weight:bold;color:#00ff88}
#chat{flex:1;overflow-y:auto;padding:15px}
.msg{margin:10px 0;padding:10px 14px;border-radius:12px;max-width:85%}
.user{background:#00ff88;color:#000;margin-left:auto}
.bot{background:#222}
#box{display:flex;padding:10px;background:#1a1a1a}
#inp{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
#btn{margin-left:8px;padding:12px 20px;border:none;border-radius:20px;background:#00ff88;font-weight:bold}
</style>
</head>
<body>
<header>SOYO MIND</header>
<div id="chat"></div>
<div id="box">
<input id="inp" placeholder="Ask me any question and doubt..." />
<button id="btn" onclick="send()">Send</button>
</div>

<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

function speakIntro(){
  const txt="I am introducing myself, my name is Soyo Mind, I am available twenty four hours, seven days a week. Ask me any question and doubt.";
  add("🔊 "+txt,"bot");
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='en-US';u.rate=0.9;u.pitch=1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

window.onload=()=>{
  setTimeout(speakIntro,1000);
  // First touch se voice unlock hoga
  document.body.addEventListener('click',()=>{
    let unlock=new SpeechSynthesisUtterance(" ");
    speechSynthesis.speak(unlock);
    speakIntro();
  },{once:true});
};

async function send(){
  let q=inp.value.trim(); if(!q)return;
  add(q,"user"); inp.value="";
  try{
    let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q})});
    let j=await r.json();
    let ans=j.reply||j.answer||"Thoda dobara bolo bhai!";
    add(ans,"bot");
    let u=new SpeechSynthesisUtterance(ans);
    u.lang='en-IN'; speechSynthesis.speak(u);
  }catch(e){add("Thoda dobara bolo bhai!","bot");}
}
inp.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
</script>
</body>
</html>
