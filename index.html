<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOYO</title>
<style>
body{margin:0;font-family:Arial;background:#fff;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow:auto;padding:15px;padding-bottom:90px}
.ai{background:#f1f1f1;padding:12px;border-radius:12px;margin:8px 0;max-width:90%;line-height:1.5}
.user{background:#000;color:#fff;padding:12px;border-radius:12px;margin:8px 0;margin-left:auto;max-width:85%;display:block}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;gap:8px;border-top:1px solid #ddd}
.bar input{flex:1;padding:14px;border-radius:25px;border:1px solid #aaa;outline:none}
.bar button{padding:14px 22px;border-radius:25px;background:#000;color:#fff;border:0;font-weight:bold}
</style>
</head>
<body>
<div id="chat">
<div class="ai">Namaste! Mai SOYO Mind hu. Kuchh bhi pucho.</div>
</div>
<div class="bar">
<input id="inp" type="text" placeholder="Kuchh bhi pucho...">
<button onclick="sendNow()">Bhejo</button>
</div>

<script>
var chat = document.getElementById('chat');
var inp = document.getElementById('inp');

// Phone band ke baad bhi chat wapas lao
var saved = localStorage.getItem('soyo_chat_final');
if(saved){ chat.innerHTML = saved; }

function sendNow(){
  var txt = inp.value.trim();
  if(txt == '') return;

  // Question turant dikhao aur input khali karo
  chat.innerHTML += '<div class="user">'+txt+'</div>';
  inp.value = ''; // YAHI SE QUESTION HAT JAYEGA

  var low = txt.toLowerCase();
  var ans = '';

  if(low.includes('bank') && low.includes('account')){
    ans = '<b>Haan, 1 hi aadmi ka 1 bank me 2 account ho sakta hai.</b><br><br>✅ 1 Savings + 1 Current<br>✅ 1 Single + 1 Joint<br>✅ RBI ne mana nahi kiya hai.<br><br>Documents: Aadhar, PAN same lagega.';
  }
  else if(low.includes('noun')){
    ans = '<b>Noun:</b> Naam wale shabd ko Noun kehte hain. Jaise Ram, Delhi, Hair, Oil.';
  }
  else if(low.includes('pronoun')){
    ans = '<b>Pronoun:</b> Noun ki jagah wala shabd. Jaise He, She, It, They.';
  }
  else if(low.includes('suraj') || low.includes('sun')){
    ans = '<b>Suraj ke 6 Layer:</b> Core, Radiative, Convective, Photosphere, Chromosphere, Corona.';
  }
  else {
    ans = '<b>Aapne pucha:</b> '+txt+'<br><br><b>Jawab:</b> '+txt+' ke baare me - Ye bilkul ho sakta hai. Iske niyam aur fayde hote hain. Aap isko aur detail me pucho to mai step-by-step bata dunga.';
  }

  chat.innerHTML += '<div class="ai">'+ans+'</div>';
  chat.scrollTop = 99999;
  
  // Chat ko save kar do taaki phone band ke baad bhi rahe
  localStorage.setItem('soyo_chat_final', chat.innerHTML);
}

inp.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ sendNow(); }
});
</script>
</body>
</html>
