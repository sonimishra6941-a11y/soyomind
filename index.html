
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOYO Mind - 24x7 AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:16px;text-align:center;background:#000;border-bottom:2px solid #00ff88}h1{color:#00ff88}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;padding:13px 18px;border-radius:20px;line-height:1.6;font-size:15px}
.user{align-self:flex-end;background:#00ff88;color:#000;font-weight:500}
.bot{align-self:flex-start;background:#1e1e1e;border:1px solid #333}
#box{display:flex;gap:8px;padding:14px;background:#000;border-top:1px solid #333}
#inp{flex:1;padding:13px 18px;border-radius:25px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none}
button{padding:12px 16px;border-radius:25px;border:none;font-weight:bold;cursor:pointer}
#send{background:#00ff88}#mic{background:#ff0055;color:#fff}#voice{background:#222;color:#00ff88;border:1px solid #00ff88}
</style>
</head>
<body>
<header><h1>🧠 SOYO Mind</h1><div id="status">24 Hours | 7 Days | Always Ready 🔊</div></header>
<div id="chat"><div class="msg bot">Tap 🔊 to hear my intro!</div></div>
<div id="box">
<input id="inp" placeholder="Kuch bolo ya likho...">
<button id="mic">🎤</button>
<button id="send">Send</button>
<button id="voice" onclick="speakIntro()">🔊</button>
</div>
<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

function speakIntro(){
  const txt="I am introducing myself, my name is Soyo Mind, twenty four hours in a day, seven days in a week.";
  add("🔊 "+txt,"bot");
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='en-US';u.rate=0.85;u.pitch=1.1;
  speechSynthesis.speak(u);
}
window.onload=()=>{setTimeout(speakIntro,1500);};

async function send(){
  const m=inp.value.trim();if(!m)return;
  add(m,'user');inp.value='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
    const d=await r.json();
    const reply=d.reply||"Error";
    add(reply,'bot');
    let u=new SpeechSynthesisUtterance(reply);u.lang='en-US';speechSynthesis.speak(u);
  }catch(e){add("Error: "+e.message,'bot');}
}
document.getElementById('send').onclick=send;
inp.addEventListener('keypress',e=>{if(e.key==='Enter')send();});

document.getElementById('mic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Mic support nahi hai');return;}
  const rec=new SR();rec.lang='hi-IN';rec.start();
  rec.onresult=e=>{inp.value=e.results[0][0].transcript;send();};
};
</script>
</body>
</html>
