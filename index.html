<!DOCTYPE html>
<html>
<head>
<title>SOYO Mind</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px;margin:0}
h2{color:gold;text-align:center}
#chat-box{border:2px solid gold;border-radius:15px;height:75vh;padding:12px;overflow-y:auto;background:#0a0a0a}
.ai-msg{border:1px solid gold;border-radius:12px;padding:10px;margin:8px 0;background:#1a1a1a}
.user-msg{background:gold;color:#000;border-radius:12px;padding:10px;margin:8px 0;text-align:right;font-weight:bold}
.input-box{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:8px}
.input-box input{flex:1;padding:14px;border-radius:25px;border:none;font-size:16px}
.input-box button{padding:14px 22px;background:gold;border:none;border-radius:25px;font-weight:bold;font-size:16px}
img{width:100%;border-radius:12px;margin-top:8px;border:2px solid gold}
</style>
</head>
<body>
<h2>⭐ SOYO Mind</h2>
<div id="chat-box">
<div class="ai-msg">Namaste! Mai SOYO Mind hu. Koi bhi sawaal pucho, photo ke liye "photo bhejo" likho.</div>
</div>

<div class="input-box">
<input id="userInput" type="text" placeholder="Yahan likho...">
<button type="button" onclick="sendMsg()">Send</button>
</div>

<script>
function sendMsg(){
  var input = document.getElementById("userInput");
  var chat = document.getElementById("chat-box");
  var msg = input.value.trim();
  if(msg==="") return;
  
  chat.innerHTML += `<div class="user-msg">${msg}</div>`;
  input.value = "";

  var low = msg.toLowerCase();

  // PHOTO FEATURE
  if(low.includes("photo") || low.includes("tasveer") || low.includes("pic") || low.includes("dikhao") || low.includes("image")){
    var q = msg.replace(/photo|bhejo|dikhao|tasveer|pic|image/gi,"").trim() || "beautiful";
    var url = "https://image.pollinations.ai/prompt/"+encodeURIComponent(q)+"?width=800&height=600&nologo=true&seed="+Math.random();
    chat.innerHTML += `<div class="ai-msg">Ye lo ${q} ki photo ✨<br><img src="${url}"></div>`;
  } 
  // TEXT ANSWER FEATURE
  else {
    var ans = "";
    if(low.includes("oil")){
      ans = "<b>Oil = Uncountable</b> hota hai. Jaise - some oil, a little oil.<br><b>Hair =</b> Sir ke pure baal Uncountable (I have black hair), lekin 1-2 baal ginna ho to Countable (I found 2 hairs).";
    } else {
      ans = "Aapne pucha: '"+msg+"'. Iska jawab hai - Ye ek accha sawaal hai! Mai SOYO Mind hu, aapka personal AI dost. Aap aur kuch puch sakte ho.";
    }
    chat.innerHTML += `<div class="ai-msg">${ans}</div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
// Enter se bhi send hoga
document.getElementById("userInput").addEventListener("keydown", function(e){
  if(e.key==="Enter"){ sendMsg(); }
});
</script>
</body>
</html>
