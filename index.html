<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOYO Mind</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f6f5fb;padding:15px;font-family:sans-serif}
.card{background:#fff;border-radius:16px;padding:16px;margin-top:12px}
.header{display:flex;justify-content:space-between}
.logo{font-weight:800;font-size:22px}
.prerna{background:linear-gradient(135deg,#a78bfa,#f0abfc);color:#fff}
.btn{width:100%;padding:15px;border-radius:12px;border:none;font-weight:700;margin-top:10px}
.btn-primary{background:#111;color:#fff}
.btn-pro{background:#fdcb6e;color:#111}
textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd}
.msg{background:#f1f0ff;padding:10px;border-radius:12px;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="header"><div class="logo">SOYO Mind</div><div>PRO</div></div>
<div class="card prerna"><h3>Aaj Ki Prerna</h3><p>Himmat mat haro!</p></div>
<div class="card">
<h3>Talk to SOYO Mind</h3>
<textarea id="userInput" placeholder="4+9 likho"></textarea>
<button class="btn btn-primary" onclick="talk()">Bhejo</button>
<div id="chatHistory"></div>
</div>
<div class="card"><h3>PRO - ₹100</h3><button class="btn btn-pro" onclick="payNow()">PRO Unlock</button></div>
<script>
function talk(){
let input=document.getElementById('userInput').value.trim();
if(!input) return;
let h=document.getElementById('chatHistory');
let d=document.createElement('div');d.className='msg';d.innerText='You: '+input;h.appendChild(d);
let r=document.createElement('div');r.className='msg';let ans="";
if(/^[0-9+\-*/().% ]+$/.test(input)){
try{let v=Function('"use strict";return ('+input+')')();ans=input+" = "+v+" hota hai! 🔥";}catch{ans="Galat hisab";}
}else{ans="'"+input+"' - Samajh gaya! Focus karo!";}
r.innerText='SOYO: '+ans;h.appendChild(r);
document.getElementById('userInput').value='';
}
function payNow(){alert('PRO Demo Active');}
</script>
</body>
</html>
