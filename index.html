<!DOCTYPE html>
<html>
<head>
  <title>SOYO Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:black; color:white; margin:0; font-family:Arial;">
  <div style="text-align:center; padding:16px; color:#00ff88; font-weight:900; font-size:22px; letter-spacing:1px;">
    SOYO Intelligence
  </div>

  <div id="chat" style="padding:16px;">
    <div style="background:#1e1e1e; padding:12px; border-radius:12px; display:inline-block; max-width:90%;">
      🔊 I am introducing myself, my name is Soyo Intelligence... Ask me any question and doubt.
    </div>
  </div>

  <div style="position:fixed; bottom:10px; left:10px; right:10px; display:flex; gap:8px;">
    <input id="q" placeholder="Ask me any question and doubt..." style="flex:1; border-radius:20px; padding:12px; border:none; outline:none;">
    <button onclick="speak()" style="background:#00ff88; border:none; border-radius:20px; padding:10px 20px; font-weight:bold;">Send</button>
  </div>

<script>
  function speak(){
    let text = document.getElementById('q').value;
    if(!text) text = "I am introducing myself, my name is Soyo Intelligence... Ask me any question and doubt.";
    let u = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(u);
    
    let div = document.createElement('div');
    div.style.cssText = "background:#00ff88; color:black; padding:10px; border-radius:12px; margin-top:10px; max-width:80%; margin-left:auto;";
    div.innerText = text;
    document.getElementById('chat').appendChild(div);
    document.getElementById('q').value = "";
  }
  window.onload = function(){
    let u = new SpeechSynthesisUtterance("I am introducing myself, my name is Soyo Intelligence");
    speechSynthesis.speak(u);
  }
</script>
</body>
</html>
